<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Autonomic Nervous System: Sympathetic vs. Parasympathetic">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111f24"/>
      <stop offset="100%" stop-color="#172a31"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182c33"/>
      <stop offset="100%" stop-color="#122127"/>
    </linearGradient>
    <pattern id="gridPat" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#223b43" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" rx="24" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="718" rx="18" fill="none" stroke="#29464f" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="34" width="136" height="26" rx="13" fill="#5ec2ab" fill-opacity="0.16" stroke="#5ec2ab" stroke-opacity="0.4"/>
  <text x="104" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em" fill="#6fd6be">CHAPTER 14</text>
  <text x="188" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#f3fbf9">Autonomic Nervous System: Sympathetic vs. Parasympathetic</text>
  <text x="38" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9db5b2">Two-neuron visceral motor chain, Thoracolumbar (T1–L2) vs. Craniosacral outflow, and neurotransmitter release</text>
  <line x1="36" y1="100" x2="1164" y2="100" stroke="#26424a" stroke-width="1.2"/>

  <!-- Left Anatomical Illustration Panel -->
  <g transform="translate(36, 118)">
    <rect width="384" height="584" rx="18" fill="url(#stageGrad)" stroke="#2d4c55" stroke-width="1.5"/>
    <rect width="384" height="584" rx="18" fill="url(#gridPat)"/>
    
      <text x="192" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6fd6be" letter-spacing="0.08em">TWO-NEURON AUTONOMIC CHAIN</text>
      <!-- Sympathetic Box -->
      <rect x="34" y="64" width="316" height="222" rx="14" fill="#1b323a" stroke="#e99a83" stroke-width="2"/>
      <text x="192" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#e99a83">SYMPATHETIC (Fight-or-Flight)</text>
      <text x="192" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbd0bd">Thoracolumbar Outflow (T1 – L2)</text>
      <line x1="60" y1="154" x2="145" y2="154" stroke="#5ec2ab" stroke-width="4"/>
      <circle cx="155" cy="154" r="10" fill="#e5c478"/>
      <line x1="165" y1="154" x2="320" y2="154" stroke="#e99a83" stroke-width="4" stroke-dasharray="6,4"/>
      <text x="102" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6fd6be">Short Pre (ACh)</text>
      <text x="242" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#e99a83">Long Post (Norepinephrine)</text>
      <text x="192" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#f1faf8">• Ganglia close to spinal cord (Sympathetic Trunk)</text>
      <text x="192" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#f1faf8">• Adrenal Medulla releases Epinephrine into blood</text>
      <text x="192" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#e5c478">• ↑ HR, bronchodilation, mydriasis, ↑ glucose</text>
      <!-- Parasympathetic Box -->
      <rect x="34" y="308" width="316" height="222" rx="14" fill="#1b323a" stroke="#5ec2ab" stroke-width="2"/>
      <text x="192" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#6fd6be">PARASYMPATHETIC (Rest-and-Digest)</text>
      <text x="192" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#d3ece7">Craniosacral Outflow (CN III, VII, IX, X + S2–S4)</text>
      <line x1="60" y1="398" x2="235" y2="398" stroke="#5ec2ab" stroke-width="4"/>
      <circle cx="245" cy="398" r="10" fill="#e5c478"/>
      <line x1="255" y1="398" x2="320" y2="398" stroke="#7cc4e8" stroke-width="4" stroke-dasharray="6,4"/>
      <text x="148" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6fd6be">Long Pre (ACh)</text>
      <text x="288" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7cc4e8">Short (ACh)</text>
      <text x="192" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#f1faf8">• Terminal ganglia in/near visceral target wall</text>
      <text x="192" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#f1faf8">• CN X (Vagus) carries 90% of parasympathetic fibers</text>
      <text x="192" y="488" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#6fd6be">• ↓ HR, GI motility/secretion, pupil miosis</text>
    
  </g>

  <!-- Right 6 High-Yield Study Cards (2x3 Grid) -->
  
      <g transform="translate(440, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#5ec2ab"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#5ec2ab" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#5ec2ab">SOMATIC vs ANS</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">1-Neuron vs. 2-Neuron Chain</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Somatic uses 1 myelinated neuron to skeletal muscle;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">ANS uses Preganglionic → Ganglion → Postganglionic.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5ec2ab">ANS targets cardiac muscle, smooth muscle &amp; glands</text>
      </g>

      <g transform="translate(805, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e99a83"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e99a83" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e99a83">T1 – L2</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Sympathetic (Thoracolumbar)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Short preganglionic (ACh) + Long postganglionic (NE);</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">ganglia sit in paravertebral sympathetic trunk.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e99a83">Exception: sweat glands use ACh on muscarinic receptors</text>
      </g>

      <g transform="translate(440, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#7cc4e8"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#7cc4e8" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#7cc4e8">CRANIOSACRAL</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Parasympathetic (CN III, VII, IX, X)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Long preganglionic (ACh) + Short postganglionic (ACh);</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">intramural ganglia sit at the effector organ.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7cc4e8">SLUDD: Salivation, Lacrimation, Urination, Digestion, Defecation</text>
      </g>

      <g transform="translate(805, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e5c478"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e5c478" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e5c478">ADRENAL</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Adrenal Medulla Hormonal Surge</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Preganglionic sympathetic fibers synapse directly</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">on chromaffin cells to release 80% Epi / 20% NE.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e5c478">Prolongs systemic fight-or-flight response in blood</text>
      </g>

      <g transform="translate(440, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#5ec2ab"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#5ec2ab" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#5ec2ab">CHOLINERGIC</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Nicotinic vs. Muscarinic (ACh)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Nicotinic: ALWAYS excitatory at all ANS ganglia;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Muscarinic: on all parasympathetic target organs.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5ec2ab">Muscarinic inhibits cardiac pacemaker (slows heart rate)</text>
      </g>

      <g transform="translate(805, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e99a83"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e99a83" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e99a83">ADRENERGIC</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Alpha (α1, α2) vs. Beta (β1, β2)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">α1 constricts blood vessels; β1 increases heart</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">rate &amp; contractility; β2 dilates bronchioles.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e99a83">Sympathetic tone maintains baseline blood pressure</text>
      </g>
</svg>
