<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Peripheral Nervous System: The 12 Pairs of Cranial Nerves">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111f24"/>
      <stop offset="100%" stop-color="#172a31"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182c33"/>
      <stop offset="100%" stop-color="#122127"/>
    </linearGradient>
    <pattern id="gridPat" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#223b43" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" rx="24" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="718" rx="18" fill="none" stroke="#29464f" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="34" width="136" height="26" rx="13" fill="#5ec2ab" fill-opacity="0.16" stroke="#5ec2ab" stroke-opacity="0.4"/>
  <text x="104" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em" fill="#6fd6be">CHAPTER 13</text>
  <text x="188" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#f3fbf9">Peripheral Nervous System: The 12 Pairs of Cranial Nerves</text>
  <text x="38" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9db5b2">Sensory, motor, and mixed cranial nerves (CN I – CN XII), target organs, and clinical testing</text>
  <line x1="36" y1="100" x2="1164" y2="100" stroke="#26424a" stroke-width="1.2"/>

  <!-- Left Anatomical Illustration Panel -->
  <g transform="translate(36, 118)">
    <rect width="384" height="584" rx="18" fill="url(#stageGrad)" stroke="#2d4c55" stroke-width="1.5"/>
    <rect width="384" height="584" rx="18" fill="url(#gridPat)"/>
    
      <text x="192" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6fd6be" letter-spacing="0.08em">CRANIAL NERVES (CN I – XII)</text>
      <rect x="34" y="58" width="316" height="498" rx="14" fill="#1b323a" stroke="#365a64"/>
      <text x="54" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7cc4e8">I. Olfactory (S) — Smell (Cribriform plate)</text>
      <text x="54" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7cc4e8">II. Optic (S) — Vision (Retina → Optic canal)</text>
      <text x="54" y="164" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e5c478">III. Oculomotor (M) — 4 eye muscles + pupil</text>
      <text x="54" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e5c478">IV. Trochlear (M) — Superior oblique muscle</text>
      <text x="54" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e99a83">V. Trigeminal (B) — Face sensation + chewing</text>
      <text x="54" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e5c478">VI. Abducens (M) — Lateral rectus (abducts eye)</text>
      <text x="54" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e99a83">VII. Facial (B) — Facial expression + ant. 2/3 taste</text>
      <text x="54" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7cc4e8">VIII. Vestibulocochlear (S) — Hearing &amp; balance</text>
      <text x="54" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e99a83">IX. Glossopharyngeal (B) — Swallowing + post. 1/3</text>
      <text x="54" y="416" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5ec2ab">X. Vagus (B) — Thoracic &amp; abdominal viscera</text>
      <text x="54" y="452" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e5c478">XI. Accessory (M) — Sternocleidomastoid &amp; Traps</text>
      <text x="54" y="488" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e5c478">XII. Hypoglossal (M) — Intrinsic/extrinsic tongue</text>
      <text x="192" y="534" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9db5b2">(S) = Sensory · (M) = Motor · (B) = Both/Mixed</text>
    
  </g>

  <!-- Right 6 High-Yield Study Cards (2x3 Grid) -->
  
      <g transform="translate(440, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#7cc4e8"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#7cc4e8" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#7cc4e8">SPECIAL SENSES</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">CN I (Olfactory), II (Optic), VIII</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Purely sensory nerves for smell (I), vision</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">(II), and hearing + equilibrium (VIII).</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7cc4e8">CN I &amp; II attach to forebrain; III–XII to brainstem</text>
      </g>

      <g transform="translate(805, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e5c478"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e5c478" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e5c478">EYE MOTION</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">CN III, IV &amp; VI (LR6-SO4)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Abducens (VI) → Lateral rectus; Trochlear (IV)</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">→ Superior oblique; Oculomotor (III) → all others.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e5c478">CN III also constricts pupil via parasympathetic fibers</text>
      </g>

      <g transform="translate(440, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e99a83"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e99a83" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e99a83">FACE &amp; JAW</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">CN V (Trigeminal) &amp; VII (Facial)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">CN V: 3 divisions (V1, V2, V3) for face touch &amp;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">chewing; CN VII: facial expression &amp; tears/saliva.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e99a83">Bell&apos;s palsy = CN VII inflammation / hemifacial paralysis</text>
      </g>

      <g transform="translate(805, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#5ec2ab"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#5ec2ab" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#5ec2ab">WANDERER</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">CN X (Vagus Nerve)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Only cranial nerve extending beyond the head/neck</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">to regulate heart rate, lungs, and GI digestion.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5ec2ab">Carries ~90% of parasympathetic preganglionic fibers</text>
      </g>

      <g transform="translate(440, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e5c478"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e5c478" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e5c478">THROAT &amp; NECK</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">CN IX, XI &amp; XII</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">IX (Glossopharyngeal): gag/swallow &amp; carotid sinus;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">XI (Accessory): head turn/shrug; XII: tongue motion.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e5c478">Damage to CN XII causes tongue deviation to injured side</text>
      </g>

      <g transform="translate(805, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#7cc4e8"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#7cc4e8" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#7cc4e8">RECEPTORS</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Sensory Receptor Classification</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Mechano-, Thermo-, Photo-, Chemo-, Nociceptors;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Exteroceptors, Interoceptors &amp; Proprioceptors.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7cc4e8">Encapsulated vs. free dendritic nerve endings</text>
      </g>
</svg>
