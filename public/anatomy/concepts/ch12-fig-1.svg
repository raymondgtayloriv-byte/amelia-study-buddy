<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Central Nervous System: Cerebral Lobes, Diencephalon &amp; Brainstem">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111f24"/>
      <stop offset="100%" stop-color="#172a31"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182c33"/>
      <stop offset="100%" stop-color="#122127"/>
    </linearGradient>
    <pattern id="gridPat" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#223b43" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" rx="24" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="718" rx="18" fill="none" stroke="#29464f" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="34" width="136" height="26" rx="13" fill="#5ec2ab" fill-opacity="0.16" stroke="#5ec2ab" stroke-opacity="0.4"/>
  <text x="104" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em" fill="#6fd6be">CHAPTER 12</text>
  <text x="188" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" fill="#f3fbf9">Central Nervous System: Cerebral Lobes, Diencephalon &amp; Brainstem</text>
  <text x="38" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9db5b2">Motor/sensory cortical mapping, thalamus, hypothalamus, midbrain-pons-medulla, and cerebellum</text>
  <line x1="36" y1="100" x2="1164" y2="100" stroke="#26424a" stroke-width="1.2"/>

  <!-- Left Anatomical Illustration Panel -->
  <g transform="translate(36, 118)">
    <rect width="384" height="584" rx="18" fill="url(#stageGrad)" stroke="#2d4c55" stroke-width="1.5"/>
    <rect width="384" height="584" rx="18" fill="url(#gridPat)"/>
    
      <text x="192" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6fd6be" letter-spacing="0.08em">BRAIN REGIONS &amp; LOBES</text>
      <!-- Cerebral Lobes Diagram -->
      <path d="M58,195 C58,105 145,72 215,78 L215,205 L58,205 Z" fill="#e99a83" fill-opacity="0.28" stroke="#e99a83" stroke-width="2.2"/>
      <text x="135" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#f1faf8">Frontal Lobe</text>
      <text x="135" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbd0bd">Motor (Precentral) + Broca</text>
      <path d="M215,78 C285,82 332,120 332,185 L215,205 Z" fill="#5ec2ab" fill-opacity="0.28" stroke="#5ec2ab" stroke-width="2.2"/>
      <text x="272" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#f1faf8">Parietal</text>
      <text x="272" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#d3ece7">Somatosensory</text>
      <path d="M98,205 L248,205 L248,276 C165,282 108,262 98,205 Z" fill="#e5c478" fill-opacity="0.28" stroke="#e5c478" stroke-width="2.2"/>
      <text x="176" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#f1faf8">Temporal Lobe</text>
      <text x="176" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f6e3b4">Auditory + Wernicke</text>
      <path d="M248,195 L336,185 C344,230 322,268 248,272 Z" fill="#7cc4e8" fill-opacity="0.28" stroke="#7cc4e8" stroke-width="2.2"/>
      <text x="292" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f1faf8">Occipital</text>
      <text x="292" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#d5eefb">Visual Cortex</text>
      <!-- Cerebellum & Brainstem -->
      <ellipse cx="282" cy="332" rx="54" ry="38" fill="#5ec2ab" fill-opacity="0.22" stroke="#5ec2ab" stroke-width="2"/>
      <text x="282" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#6fd6be">Cerebellum</text>
      <rect x="166" y="286" width="54" height="148" rx="14" fill="#23424a" stroke="#e5c478" stroke-width="2"/>
      <text x="193" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e5c478">Midbrain</text>
      <text x="193" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e5c478">Pons</text>
      <text x="193" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e99a83">Medulla</text>
      <text x="192" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1faf8">Central Sulcus divides Precentral (Motor)</text>
      <text x="192" y="504" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1faf8">from Postcentral (Somatosensory) Gyrus</text>
    
  </g>

  <!-- Right 6 High-Yield Study Cards (2x3 Grid) -->
  
      <g transform="translate(440, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e99a83"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e99a83" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e99a83">CORTEX</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Motor vs. Somatosensory Gyri</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Precentral gyrus (Frontal) = primary motor;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Postcentral gyrus (Parietal) = somatosensory.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e99a83">Contralateral control; mapped by homunculus</text>
      </g>

      <g transform="translate(805, 118)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#5ec2ab"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#5ec2ab" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#5ec2ab">LANGUAGE</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Broca’s vs. Wernicke’s Areas</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Broca’s (left frontal) = motor speech production;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Wernicke’s (temporal-parietal) = comprehension.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5ec2ab">Corpus callosum commissure connects R &amp; L hemispheres</text>
      </g>

      <g transform="translate(440, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#7cc4e8"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#7cc4e8" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#7cc4e8">RELAY</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Thalamus (Diencephalon)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">The &apos;gateway to the cerebral cortex&apos; that</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">sorts, edits &amp; relays afferent sensory impulses.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7cc4e8">Every sense except olfaction (smell) relays here</text>
      </g>

      <g transform="translate(805, 310)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e5c478"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e5c478" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e5c478">MASTER</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Hypothalamus</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Visceral control center: ANS, body temp, hunger,</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">thirst, circadian rhythms &amp; pituitary hormones.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e5c478">Epithalamus (pineal gland) secretes melatonin</text>
      </g>

      <g transform="translate(440, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e99a83"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#e99a83" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#e99a83">AUTONOMIC</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Brainstem (Midbrain, Pons, Medulla)</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Medulla houses vital cardiac, vasomotor &amp;</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">respiratory centers + pyramidal decussation.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e99a83">Crossover of motor tracts explains contralateral control</text>
      </g>

      <g transform="translate(805, 502)">
        <rect width="345" height="172" rx="16" fill="#1b3037" stroke="#2e4d56" stroke-width="1.5"/>
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#5ec2ab"/>
        <rect x="22" y="16" width="96" height="22" rx="11" fill="#5ec2ab" fill-opacity="0.16"/>
        <text x="70" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.08em" fill="#5ec2ab">COORDINATION</text>
        <text x="22" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="800" fill="#f1faf8">Cerebellum &amp; Basal Nuclei</text>
        <text x="22" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">Cerebellum compares motor plan vs. proprioception</text>
        <text x="22" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c3d9d5">for smooth balance; Basal nuclei filter movement.</text>
        <line x1="22" y1="132" x2="323" y2="132" stroke="#2a4750" stroke-width="1"/>
        <text x="22" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#5ec2ab">Arbor vitae = cerebellar white matter tree</text>
      </g>
</svg>
