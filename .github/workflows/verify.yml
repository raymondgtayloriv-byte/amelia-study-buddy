name: Verify Study Buddy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:study
      - run: npm run smoke
      - run: npm run verify:content
      - run: npm run secrets-scan
      - run: npm run build
